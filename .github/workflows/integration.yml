name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full distro table; also the early warning for vendor URL changes.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated images (e.g. ubuntu:noble,rocky:9), or 'all'"
        required: false
        default: all

permissions:
  contents: read

# One self-hosted runner: queue runs instead of booting two tables at once.
concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    # Never run fork PR code on the self-hosted runner (libvirt + sudo).
    # Same-repo PRs, pushes to main, the nightly run and manual dispatch still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, libvirt]
    timeout-minutes: 150
    env:
      # Pull requests boot ubuntu:noble only; everything else runs the full table.
      VMHERD_E2E_IMAGES: ${{ github.event_name == 'pull_request' && 'ubuntu:noble' || inputs.images || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Runner resources
        run: |
          free -g
          nproc
          df -h /var/lib/libvirt/images
      - name: Run integration tests
        run: go test -tags integration -count=1 -timeout=140m -v ./...
